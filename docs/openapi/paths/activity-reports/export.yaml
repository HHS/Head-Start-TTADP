post:
  tags:
    - activity-reports
  summary: Export Activity Reports, Goals, or Objectives as a flat CSV.
  description: >-
    Streams a flat CSV export for one of three data sets, scoped to a
    caller-supplied list of Activity Report ids or the entire filtered approved
    Activity Report table when exportAll is true. Full-table exports accept the
    same query-string filters as GET /activity-reports; pagination does not limit
    the export. Matching ids are resolved on the server without a report-count
    cap. The CSV is streamed from a
    server-side cursor so large
    exports do not buffer in memory. Region access is always enforced from the
    user's policy, regardless of the ids supplied. Only approved reports are
    included.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - dataSet
          anyOf:
            - required: [reportIds]
            - required: [exportAll]
              properties:
                exportAll:
                  enum: [true]
          properties:
            dataSet:
              type: string
              description: Which export to run.
              enum:
                - activity-reports
                - goals
                - objectives
            reportIds:
              type: array
              description: >-
                Activity Report ids to scope the export to, already resolved on
                the page. Required unless exportAll is true; an empty array
                yields an empty export. Selected-id requests are limited to
                10,000 reports.
              maxItems: 10000
              items:
                type: integer
            exportAll:
              type: boolean
              default: false
              description: >-
                Export all approved reports matching the query-string filters
                and the user's readable regions instead of using reportIds.
                Existing concurrency and timeout safeguards still apply.
            sortBy:
              type: string
              description: >-
                Column to sort by. Must be one of the data set's supported sort
                columns, otherwise the request is rejected. When omitted, the
                export's default sort applies.
            direction:
              type: string
              description: Sort direction. Only applies when sortBy is set.
              enum:
                - ASC
                - DESC
              default: ASC
  responses:
    200:
      description: Streamed CSV export.
      content:
        text/csv; charset=utf-8:
          schema:
            type: string
    400:
      description: >-
        Invalid request: unknown dataSet, missing or non-integer reportIds
        without exportAll, too many selected reportIds, or
        an unsupported sort column/direction.
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
    429:
      description: Too many exports are already running. Retry later.
