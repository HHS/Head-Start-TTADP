get:
  tags:
    - session report
  summary: Get a single session report by its ID
  parameters:
    - name: id
      in: path
      description: ID of the session report to retrieve
      required: true
      schema:
        type: integer
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            $ref: '../../../index.yaml#/components/schemas/sessionReport'
put:
  tags:
    - session report
  summary: Update a session report by its ID
  description: >-
    Updates session data for an authorized event owner, collaborator, POC, admin,
    or submitted-session approver. The Session summary UI exposes facilitation
    editing to admins; this endpoint uses the general session edit authorization.
  parameters:
    - name: id
      in: path
      description: ID of the session report to update
      required: true
      schema:
        type: integer
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            eventId:
              type: integer
            data:
              type: object
              properties:
                facilitation:
                  type: string
                  description: >-
                    Training facilitation. The form offers national_center,
                    regional_tta_staff, and both. Legacy sessions may contain
                    an empty string.
  responses:
    '201':
      description: Updated session report
      content:
        application/json:
          schema:
            $ref: '../../../index.yaml#/components/schemas/sessionReport'
    '403':
      description: Not authorized to edit the session
delete:
  tags:
    - session report
  summary: Delete a session report by ID
  parameters:
    - name: eventId
      in: path
      description: ID of the session report to delete
      required: true
      schema:
        type: integer
  responses:
    '200':
      description: OK
