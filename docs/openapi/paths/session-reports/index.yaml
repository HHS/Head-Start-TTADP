post:
  tags:
    - session report
  summary: Create a session for a training report
  description: >-
    Available to authorized event owners, collaborators, POCs, and admins.
    Regional PD events with National Centers require a valid data.facilitation
    before creation, including when the creator is an admin. Regional TTA events
    without National Centers do not require this field.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - eventId
            - data
          properties:
            eventId:
              type: string
              description: Training report event identifier
              example: R08-PD-26-26848
            data:
              type: object
              properties:
                facilitation:
                  type: string
                  description: Required for Regional PD events with National Centers
                  enum:
                    - national_center
                    - regional_tta_staff
                    - both
  responses:
    '201':
      description: Created session report
      content:
        application/json:
          schema:
            $ref: '../../index.yaml#/components/schemas/sessionReport'
    '400':
      description: Missing event ID or missing/invalid facilitation for a Regional PD event with National Centers
    '403':
      description: Not authorized to create a session for this event
    '404':
      description: Event not found
get:
  tags:
    - session report
  description: Retrieves session reports with pagination, sorting, and filtering
  parameters:
    - in: query
      name: sortBy
      schema:
        type: string
      description: Field to sort by (id, sessionName, startDate, endDate, eventId, eventName)
      example: id
    - in: query
      name: sortDir
      schema:
        type: string
      description: Sort direction (asc or desc)
      example: DESC
    - in: query
      name: offset
      schema:
        type: number
      description: Pagination offset
      example: 0
    - in: query
      name: limit
      schema:
        type: number
      description: Pagination limit
      example: 10
    - in: query
      name: format
      schema:
        type: string
      description: Response format (json or csv)
      example: json
    - in: query
      name: startDate.bef
      schema:
        type: string
      description: Include reports with start date before the ISO8601 value
    - in: query
      name: startDate.aft
      schema:
        type: string
      description: Include reports with start date after the ISO8601 value
    - in: query
      name: eventId.ctn
      schema:
        type: string
      description: Filter by event ID contains
  responses:
    200:
      description: Successfully retrieved session reports
      content:
        application/json:
          schema:
            $ref: '../../index.yaml#/components/schemas/sessionReportsResponse'
    403:
      description: Forbidden - user does not have access to any region
    500:
      description: Internal server error
