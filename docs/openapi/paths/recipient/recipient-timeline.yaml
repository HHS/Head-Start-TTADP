get:
  tags:
    - recipient
  summary: Retrieve timeline events for a recipient in a region
  operationId: getRecipientTimeline
  parameters:
    - in: path
      name: recipientId
      required: true
      schema:
        type: integer
        minimum: 1
    - in: path
      name: regionId
      required: true
      schema:
        type: integer
        minimum: 1
    - in: query
      name: limit
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    - in: query
      name: offset
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
    - in: query
      name: sortBy
      required: false
      schema:
        type: string
        enum:
          - date
        default: date
    - in: query
      name: direction
      required: false
      schema:
        type: string
        enum:
          - asc
          - desc
        default: desc
    - in: query
      name: filters
      required: false
      schema:
        type: array
        maxItems: 20
        items:
          type: string
          minLength: 1
          maxLength: 2000
          description: Serialized timeline filter JSON with topic, condition, and query fields.
    - in: query
      name: excludeMultiRecipientCommunications
      required: false
      schema:
        type: boolean
        default: false
      description: Exclude communications associated with more than one recipient.
  responses:
    200:
      description: Timeline events for the recipient
      content:
        application/json:
          schema:
            type: object
            required:
              - count
              - events
            properties:
              count:
                type: integer
                minimum: 0
              events:
                type: array
                items:
                  type: object
                  required:
                    - source
                    - sourceId
                    - date
                    - eventType
                  properties:
                    source:
                      type: string
                      minLength: 1
                      description: Stable timeline source discriminator.
                    sourceId:
                      type: integer
                      minimum: 1
                      description: Identifier of the event within its source.
                    date:
                      type: string
                      format: date
                      description: Event date used for timeline ordering.
                    eventType:
                      type: string
                      enum:
                        - Email communication
                        - Phone communication
                        - In person communication
                        - Virtual communication
                        - TTA activity
                        - Training session
                        - Goal added
                        - Goal suspended
                        - Goal closed
                        - Goal reopened
                        - TTA request
                        - Monitoring report received
                      minLength: 1
          example:
            count: 0
            events: []
    400:
      description: Invalid path or query parameters
    401:
      description: Authentication is required
    403:
      description: User does not have access to the requested region
    404:
      description: Recipient was not found
