get:
  tags:
    - recipient
  summary: Retrieve timeline events for a recipient in a region
  operationId: getRecipientTimeline
  parameters:
    - in: path
      name: recipientId
      required: true
      schema:
        type: integer
        minimum: 1
    - in: path
      name: regionId
      required: true
      schema:
        type: integer
        minimum: 1
    - in: query
      name: limit
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    - in: query
      name: offset
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
    - in: query
      name: sortBy
      required: false
      schema:
        type: string
        enum:
          - date
        default: date
    - in: query
      name: direction
      required: false
      schema:
        type: string
        enum:
          - asc
          - desc
        default: desc
    - in: query
      name: filters
      required: false
      schema:
        type: array
        maxItems: 20
        items:
          type: string
          minLength: 1
          maxLength: 2000
          description: Serialized timeline filter JSON with topic, condition, and query fields.
    - in: query
      name: excludeMultiRecipientCommunications
      required: false
      schema:
        type: boolean
        default: false
      description: Exclude communications associated with more than one recipient.
  responses:
    200:
      description: Timeline events for the recipient
      content:
        application/json:
          schema:
            type: object
            required:
              - count
              - events
            properties:
              count:
                type: integer
                minimum: 0
              events:
                type: array
                items:
                  type: object
                  required:
                    - source
                    - sourceId
                    - date
                    - eventType
                    - durationHours
                    - title
                    - subtitle
                    - byline
                    - indicators
                    - tags
                    - details
                    - links
                  properties:
                    source:
                      type: string
                      minLength: 1
                      description: Stable timeline source discriminator.
                    sourceId:
                      type: integer
                      minimum: 1
                      description: Identifier of the event within its source.
                    date:
                      type: string
                      format: date
                      description: Event date used for timeline ordering.
                    eventType:
                      type: string
                      enum:
                        - Email communication
                        - Phone communication
                        - In person communication
                        - Virtual communication
                        - TTA activity
                        - Training session
                        - Goal added
                        - Goal suspended
                        - Goal closed
                        - Goal reopened
                        - TTA request
                        - Monitoring report received
                      minLength: 1
                    durationHours:
                      type: number
                      nullable: true
                      minimum: 0
                    title:
                      type: string
                      minLength: 1
                    subtitle:
                      type: string
                      nullable: true
                    byline:
                      type: object
                      nullable: true
                      required:
                        - label
                        - values
                      properties:
                        label:
                          type: string
                          minLength: 1
                        values:
                          type: array
                          items:
                            type: string
                            minLength: 1
                    indicators:
                      type: array
                      items:
                        type: string
                        enum:
                          - multiRecipient
                    tags:
                      type: array
                      items:
                        type: object
                        required:
                          - label
                          - flagged
                        properties:
                          label:
                            type: string
                            minLength: 1
                          flagged:
                            type: boolean
                    details:
                      type: array
                      items:
                        type: object
                        required:
                          - label
                          - items
                        properties:
                          label:
                            type: string
                            minLength: 1
                          items:
                            type: array
                            items:
                              type: object
                              required:
                                - text
                              properties:
                                text:
                                  type: string
                                  minLength: 1
                                link:
                                  type: string
                    links:
                      type: array
                      items:
                        type: object
                        required:
                          - label
                          - to
                        properties:
                          label:
                            type: string
                            minLength: 1
                          to:
                            type: string
                            minLength: 1
                          external:
                            type: boolean
          example:
            count: 1
            events:
              - source: activityReport
                sourceId: 123
                date: 2026-05-09
                eventType: TTA activity
                durationHours: 5
                title: TTA activity
                subtitle: null
                byline:
                  label: Specialists
                  values:
                    - Isabella Baker, GS
                indicators: []
                tags:
                  - label: New Leaders
                    flagged: false
                details:
                  - label: Delivery method
                    items:
                      - text: Virtual
                  - label: Grant numbers
                    items:
                      - text: 14CH012057 - HS
                links:
                  - label: View activity report
                    to: /activity-reports/view/123
    400:
      description: Invalid path or query parameters
    401:
      description: Authentication is required
    403:
      description: User does not have access to the requested region
    404:
      description: Recipient was not found
