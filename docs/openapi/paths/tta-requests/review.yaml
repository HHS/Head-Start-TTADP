put:
  tags:
    - tta request
  summary: Review a submitted TTA request
  description: >-
    Available only to the request's reviewer, while it is submitted and they can
    review in its region. Needs action is the only review so far: it sends the
    request back to its creator, sets the status to needs_action, and adds the
    review and its note to the request's notes.
  parameters:
    - name: ttaRequestId
      in: path
      description: ID of the TTA request
      required: true
      schema:
        type: integer
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - status
          properties:
            status:
              type: string
              enum:
                - needs_action
            note:
              type: string
              nullable: true
              description: The reviewer's notes for the creator
  responses:
    '200':
      description: Reviewed TTA request
      content:
        application/json:
          schema:
            $ref: '../../index.yaml#/components/schemas/ttaRequest'
    '400':
      description: Malformed ID or body, or the user is not the request's reviewer
    '403':
      description: Not the reviewer, not submitted, or no review permission in the region
    '404':
      description: TTA request not found
