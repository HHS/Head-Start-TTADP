get:
  tags:
    - tta request
  summary: List the current user's draft TTA requests for a recipient
  description: >-
    Drafts are private to their creator, so this lists only the current
    user's own drafts for the recipient in the region.
  parameters:
    - name: regionId
      in: path
      required: true
      schema:
        type: integer
    - name: recipientId
      in: path
      required: true
      schema:
        type: integer
  responses:
    '200':
      description: The user's draft TTA requests for the recipient
      content:
        application/json:
          schema:
            type: object
            properties:
              count:
                type: integer
              rows:
                type: array
                items:
                  $ref: '../../index.yaml#/components/schemas/ttaRequestListItem'
    '400':
      description: The region or recipient ID is not an integer
    '403':
      description: No read permission in the region
