get:
  tags:
    - tta request
  summary: List the users who can review TTA requests in a region
  description: >-
    Reviewers are active users with write permission in the region and at least
    one of the ECS, GS, SS, AA, FES, HS, PS, CO, TTAC, ECM, GSM or RPM roles.
  parameters:
    - name: regionId
      in: path
      required: true
      schema:
        type: integer
  responses:
    '200':
      description: The region's reviewers, ordered by name
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '../../index.yaml#/components/schemas/selectableUser'
    '400':
      description: The region ID is not an integer
    '403':
      description: No read permission in the region
