get:
  tags:
    - tta request
  summary: List the users who can review TTA requests in a region
  description: >-
    Reviewers are active users with the REVIEW_TTA_REQUESTS permission in the region.
    Primary and backup approvers are not listed unless they also hold that permission.
  parameters:
    - name: regionId
      in: path
      required: true
      schema:
        type: integer
  responses:
    '200':
      description: The region's reviewers, ordered by name
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '../../index.yaml#/components/schemas/selectableUser'
    '400':
      description: The region ID is not an integer
    '403':
      description: No read permission in the region
