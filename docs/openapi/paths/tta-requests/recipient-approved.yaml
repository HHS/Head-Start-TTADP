get:
  tags:
    - tta request
  summary: List approved TTA requests for a recipient
  description: >-
    The recipient's requests the COR has approved in the region, with their assigned staff. Newest approval first.
  parameters:
    - name: regionId
      in: path
      required: true
      schema:
        type: integer
    - name: recipientId
      in: path
      required: true
      schema:
        type: integer
  responses:
    '200':
      description: The approved TTA requests
      content:
        application/json:
          schema:
            type: object
            properties:
              count:
                type: integer
              rows:
                type: array
                items:
                  $ref: '../../index.yaml#/components/schemas/ttaRequestListItem'
    '400':
      description: The region or recipient ID is not an integer
    '403':
      description: No read permission in the region
