name: Dependabot Jira Issue Link

# Uses pull_request_target (rather than pull_request) so the workflow gets a
# GITHUB_TOKEN with write access even though the PR is opened by Dependabot.
on:
  pull_request_target:
    types: [opened]

permissions:
  pull-requests: write

jobs:
  add_jira_link:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      # Checked out at the base ref (trusted), only to reuse the shared Jira
      # link validation logic - no PR-authored code is executed.
      - name: Check out base branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Append Jira issue link to PR body
        uses: actions/github-script@v7
        with:
          # A PAT is required (not the default GITHUB_TOKEN): edits made with
          # GITHUB_TOKEN don't trigger a new `pull_request.edited` event, so the
          # pr-jira-issue-link check would never re-run against the updated body.
          github-token: ${{ secrets.DEPENDABOT_JIRA_LINK_PAT }}
          script: |
            const { validatePullRequestBody } = require('./tools/pr-jira-issue-link');

            const jiraSection = [
              '',
              '## Jira Issue(s)',
              '',
              '<!-- Link a Jira issue for this PR. Replace TTAHUB-0 before requesting review. -->',
              '<!-- Maintenance, dependency, docs, and CI/CD changes still require a dedicated Jira issue. -->',
              '* https://jira.acf.gov/browse/TTAHUB-4915',
              '',
            ].join('\n');

            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
            });

            // Skip only if the Jira Issue(s) section already has a real (non-placeholder) link.
            if (validatePullRequestBody(pr.body || '').valid) {
              return;
            }

            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              body: `${pr.body || ''}${jiraSection}`,
            });
