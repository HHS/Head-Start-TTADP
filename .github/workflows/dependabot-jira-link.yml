name: Dependabot Jira Issue Link

# Uses pull_request_target (rather than pull_request) so the workflow gets a
# GITHUB_TOKEN with write access even though the PR is opened by Dependabot.
on:
  pull_request_target:
    types: [opened]

permissions:
  pull-requests: write

jobs:
  add_jira_link:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Append Jira issue link to PR body
        uses: actions/github-script@v7
        with:
          script: |
            const jiraSection = [
              '',
              '## Jira Issue(s)',
              '',
              '<!-- Link a Jira issue for this PR. Replace TTAHUB-0 before requesting review. -->',
              '<!-- Maintenance, dependency, docs, and CI/CD changes still require a dedicated Jira issue. -->',
              '* https://jira.acf.gov/browse/TTAHUB-4915',
              '',
            ].join('\n');

            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
            });

            if (pr.body && pr.body.includes('jira.acf.gov/browse/TTAHUB')) {
              return;
            }

            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              body: `${pr.body || ''}${jiraSection}`,
            });
