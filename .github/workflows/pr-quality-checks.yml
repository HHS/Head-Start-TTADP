name: PR Quality Checks

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted]

permissions:
  contents: read
  pull-requests: write
  issues: write

# These checks are informational only, so nothing here should ever make a PR look failed.
# Concurrency is set per job: GitHub reports checks per event, so a review run cancelling a
# pull_request run would leave the pull_request check showing as failing.
jobs:
  diff_size_check:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref != 'production' }}
    runs-on: ubuntu-latest
    # Only pull_request events run this, so a newer push can safely cancel the older head's run.
    concurrency:
      group: pr-quality-diff-size-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - name: Comment diff size advisory
        # The script catches its own errors; this also covers failures outside it (e.g. the action itself).
        # The timeout is on the step so continue-on-error absorbs it; a GitHub API hang should not
        # leave the PR pending for the six-hour default.
        continue-on-error: true
        timeout-minutes: 5
        uses: actions/github-script@v8
        with:
          script: |
            try {
              const owner = context.repo.owner;
              const repo = context.repo.repo;
              const pr = context.payload.pull_request;
              const prNumber = pr.number;
              core.info(`event: ${context.eventName} action: ${context.payload.action ?? 'n/a'}`);
              core.info(`repo: ${owner}/${repo} pr: #${prNumber} base: ${pr.base.ref}`);
              core.info(`cross-repo (fork): ${pr.head.repo.full_name !== pr.base.repo.full_name}`);
              const totalLines = pr.additions + pr.deletions;
              const threshold = 500;
              const marker = '<!-- pr-quality-diff-size -->';
              const status = totalLines >= threshold
                ? `⚠️ **Diff size advisory:** This PR is **${totalLines} lines** (${pr.additions}+, ${pr.deletions}−), exceeding the ${threshold}-line guideline. Consider splitting into smaller changes.`
                : `✅ **Diff size:** ${totalLines} lines — within the ${threshold}-line guideline.`;
              const body = `${marker}\n${status}`;
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner, repo, issue_number: prNumber, per_page: 100,
              });
              const existing = comments.find((c) => c.body.includes(marker));
              if (existing) {
                await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
              } else {
                await github.rest.issues.createComment({ owner, repo, issue_number: prNumber, body });
              }
            } catch (e) {
              const status = e.status ?? 'n/a';
              const where = e.request?.url ?? 'unknown endpoint';
              core.warning(`diff_size_check failed (${status}) at ${where}: ${e.message}`);
            }

  review_count_check:
    if: ${{ github.event.pull_request.base.ref != 'production' }}
    runs-on: ubuntu-latest
    # Both events write the same comment, so share one group to serialize them (no duplicate
    # comments, no stale count overwriting a newer one). Never cancel the running job, and queue
    # pending ones instead of replacing them; a replaced job would show as a cancelled check.
    concurrency:
      group: pr-quality-review-count-${{ github.event.pull_request.number }}
      cancel-in-progress: false
      queue: max
    steps:
      - name: Comment review count advisory
        continue-on-error: true
        timeout-minutes: 5
        uses: actions/github-script@v8
        with:
          script: |
            try {
              const owner = context.repo.owner;
              const repo = context.repo.repo;
              const pr = context.payload.pull_request;
              const prNumber = pr.number;
              const prAuthor = pr.user.login;
              core.info(`event: ${context.eventName} action: ${context.payload.action ?? 'n/a'}`);
              core.info(`repo: ${owner}/${repo} pr: #${prNumber} base: ${pr.base.ref}`);
              core.info(`cross-repo (fork): ${pr.head.repo.full_name !== pr.base.repo.full_name}`);
              const requiredApprovals = 2;
              const marker = '<!-- pr-quality-review-count -->';
              const isBotAccount = (login) => {
                if (!login) return true;
                if (login.endsWith('[bot]')) return true;
                const knownBots = ['dependabot', 'github-actions', 'copilot', 'renovate', 'snyk-bot'];
                return knownBots.some((b) => login.toLowerCase().startsWith(b));
              };
              const reviews = await github.paginate(github.rest.pulls.listReviews, {
                owner, repo, pull_number: prNumber, per_page: 100,
              });
              const getReviewTimestamp = (review) => {
                const submittedAt = review.submitted_at ?? review.created_at;
                if (!submittedAt) return Number.NEGATIVE_INFINITY;
                const timestamp = Date.parse(submittedAt);
                return Number.isNaN(timestamp) ? Number.NEGATIVE_INFINITY : timestamp;
              };
              // Latest state per reviewer; COMMENTED is ignored (not an approval/rejection signal).
              const latestStateByReviewer = new Map();
              for (const review of reviews) {
                const login = review.user?.login;
                if (!login || isBotAccount(login) || login === prAuthor) continue;
                if (['APPROVED', 'CHANGES_REQUESTED', 'DISMISSED'].includes(review.state)) {
                  const reviewTimestamp = getReviewTimestamp(review);
                  const previousReview = latestStateByReviewer.get(login);
                  const previousTimestamp = previousReview ? previousReview.submittedAt : Number.NEGATIVE_INFINITY;
                  if (!previousReview || reviewTimestamp >= previousTimestamp) {
                    latestStateByReviewer.set(login, {
                      state: review.state,
                      submittedAt: reviewTimestamp,
                    });
                  }
                }
              }
              const approvers = [...latestStateByReviewer.entries()]
                .filter(([, review]) => review.state === 'APPROVED')
                .map(([login]) => login);
              const count = approvers.length;
              const status = count < requiredApprovals
                ? `⚠️ **Review count advisory:** ${count} of ${requiredApprovals} required human approvals.` +
                  ` ${requiredApprovals - count} more needed.` +
                  (count > 0 ? ` Current approvers: ${approvers.join(', ')}.` : '')
                : `✅ **Review count:** ${count} human approval${count !== 1 ? 's' : ''} — ${approvers.join(', ')}.`;
              const body = `${marker}\n${status}`;
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner, repo, issue_number: prNumber, per_page: 100,
              });
              const existing = comments.find((c) => c.body.includes(marker));
              if (existing) {
                await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
              } else {
                await github.rest.issues.createComment({ owner, repo, issue_number: prNumber, body });
              }
            } catch (e) {
              const status = e.status ?? 'n/a';
              const where = e.request?.url ?? 'unknown endpoint';
              core.warning(`review_count_check failed (${status}) at ${where}: ${e.message}`);
            }
